spring.application.name=hospitality-backend

# --- Database (update credentials for your local MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/hospitality_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- JWT ---
# Replace with a long, random secret before deploying anywhere real.
jwt.secret=change-this-to-a-long-random-secret-before-deploying
jwt.expiration-ms=86400000

server.port=8081
